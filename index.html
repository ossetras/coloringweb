<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>Doodle Desk — Color Anything!</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#FBF3E4;
  --paper-deep:#F3E7D2;
  --ink:#3A2A21;
  --coral:#FF6F59;
  --coral-deep:#E85A45;
  --yellow:#FFC93C;
  --sky:#57B8E0;
  --mint:#59C6A0;
  --lavender:#B79CED;
  --pink:#FF9EC7;
  --line:#2b2219;
  --card:#fffaf0;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:
    radial-gradient(circle at 8px 8px, rgba(58,42,33,0.035) 1.4px, transparent 1.5px) 0 0/26px 26px,
    var(--paper);
  color:var(--ink);
  font-family:'Quicksand',-apple-system,sans-serif;
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
h1,h2,h3,.display{
  font-family:'Baloo 2','Quicksand',sans-serif;
  font-weight:800;
  margin:0;
  letter-spacing:0.2px;
}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}
a{color:inherit;text-decoration:none;}
img{max-width:100%;display:block;}
::selection{background:var(--yellow);}
.ic{display:inline-block;vertical-align:-4px;flex-shrink:0;}
.ic svg{display:block;width:100%;height:100%;}
button .ic, .name .ic, h2 .ic, h3 .ic{vertical-align:-3px;margin-right:2px;}
.brand-badge .ic{vertical-align:middle;margin:0;}
.tool-btn .ic{vertical-align:middle;margin:0;}
.fav .ic, .sparkle .ic{vertical-align:middle;margin:0;}
.em .ic{vertical-align:middle;margin:0;}

.wrap{max-width:1180px;margin:0 auto;padding:0 22px;}

/* ---------- crayon button ---------- */
.btn{
  display:inline-flex;align-items:center;gap:10px;
  font-family:'Baloo 2',sans-serif;font-weight:700;font-size:17px;
  padding:14px 26px;border-radius:999px;
  border:3px solid var(--line);
  background:var(--yellow);
  color:var(--ink);
  box-shadow:5px 5px 0 var(--line);
  transition:transform .12s ease, box-shadow .12s ease;
  white-space:nowrap;
}
.btn:hover{transform:translate(-2px,-2px);box-shadow:7px 7px 0 var(--line);}
.btn:active{transform:translate(1px,1px);box-shadow:2px 2px 0 var(--line);animation:wob .3s;}
.btn.coral{background:var(--coral);color:#fff;}
.btn.sky{background:var(--sky);color:#173040;}
.btn.mint{background:var(--mint);color:#0d3626;}
.btn.pink{background:var(--pink);color:#4a132c;}
.btn.ghost{background:var(--card);}
.btn.small{padding:9px 16px;font-size:14px;box-shadow:3px 3px 0 var(--line);border-width:2px;}
.btn.small:hover{box-shadow:5px 5px 0 var(--line);}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none !important;}
@keyframes wob{0%{transform:rotate(0)}25%{transform:rotate(-3deg)}75%{transform:rotate(3deg)}100%{transform:rotate(0)}}

/* ---------- top nav ---------- */
.topbar{padding:18px 0 6px;}
.topbar-row{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;}
.brand{display:flex;align-items:center;gap:10px;font-size:26px;}
.brand-badge{
  width:46px;height:46px;border-radius:50% 42% 55% 45%/48% 55% 42% 52%;
  background:var(--coral);border:3px solid var(--line);
  display:flex;align-items:center;justify-content:center;font-size:22px;
  transform:rotate(-6deg);
}
.kidnav{display:flex;gap:10px;flex-wrap:wrap;}
.kidnav button{
  font-family:'Baloo 2',sans-serif;font-weight:700;font-size:15px;
  padding:10px 18px;border-radius:16px;border:2.5px solid var(--line);
  background:var(--card);box-shadow:3px 3px 0 var(--line);
  transition:transform .12s;
}
.kidnav button.active{background:var(--sky);}
.kidnav button:hover{transform:translateY(-2px) rotate(-1deg);}
.grownups-btn{
  font-family:'Baloo 2',sans-serif;font-weight:700;font-size:14px;
  padding:9px 16px;border-radius:14px;border:2px dashed var(--ink);
  background:var(--paper-deep);opacity:.85;
}
.grownups-btn:hover{opacity:1;}
.sound-toggle{
  width:38px;height:38px;border-radius:50%;border:2px solid var(--line);background:var(--card);
  display:flex;align-items:center;justify-content:center;box-shadow:2px 2px 0 var(--line);
  transition:transform .12s;flex-shrink:0;
}
.sound-toggle:hover{transform:translateY(-2px);}
.sound-toggle:active{transform:translate(1px,1px);}

/* ---------- hero ---------- */
.hero{padding:36px 0 20px;position:relative;}
.hero-grid{display:grid;grid-template-columns:1.1fr 1fr;gap:40px;align-items:center;}
.hero h1{font-size:56px;line-height:1.05;}
.hero h1 .hl{color:var(--coral);position:relative;}
.hero p.lead{font-size:19px;margin:18px 0 26px;max-width:460px;color:#5a493d;}
.hero-ctas{display:flex;gap:14px;flex-wrap:wrap;}
.stat-strip{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px;}
.stat-pill{
  display:flex;align-items:center;gap:7px;background:var(--card);border:2px solid var(--line);
  border-radius:14px;padding:8px 14px;box-shadow:2px 2px 0 var(--line);
  font-family:'Baloo 2';font-size:13px;color:#5a493d;
}
.stat-pill b{font-size:15px;color:var(--ink);}
.hero-art{position:relative;height:400px;}
.hero-page{
  position:absolute;left:50%;top:50%;transform:translate(-50%,-52%) rotate(-3deg);
  width:300px;background:#fff;border:4px solid var(--line);border-radius:18px 28px 18px 30px;
  box-shadow:9px 9px 0 var(--line);
  animation:float 5s ease-in-out infinite;
  padding:10px;
}
@keyframes float{0%,100%{transform:translate(-50%,-52%) rotate(-3deg)}50%{transform:translate(-50%,-56%) rotate(-1deg)}}
.doodle{position:absolute;filter:drop-shadow(2px 2px 0 rgba(0,0,0,0.08));}
.spin-slow{animation:spin 9s linear infinite;}
@keyframes spin{to{transform:rotate(360deg)}}
.bob{animation:bob 3.4s ease-in-out infinite;}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}

/* ---------- section heading ---------- */
.section{padding:46px 0;}
.section-head{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:22px;flex-wrap:wrap;}
.section-head h2{font-size:32px;}
.section-head p{color:#6b5c4e;margin-top:6px;font-size:15px;}
.tag{
  display:inline-block;background:var(--lavender);border:2px solid var(--line);
  border-radius:999px;padding:4px 14px;font-family:'Baloo 2';font-weight:700;font-size:13px;
  transform:rotate(-2deg);margin-bottom:10px;
}

/* ---------- search ---------- */
.search-row{
  display:flex;align-items:center;gap:10px;background:var(--card);border:2.5px solid var(--line);
  border-radius:16px;padding:10px 16px;max-width:420px;margin-bottom:18px;box-shadow:3px 3px 0 var(--line);
  color:#6b5c4e;
}
.search-row input{
  border:none;background:transparent;outline:none;font-family:'Quicksand';font-weight:600;font-size:15px;
  color:var(--ink);width:100%;
}
.no-results{text-align:center;color:#8a7c6c;font-family:'Baloo 2';font-weight:700;padding:30px 0;display:flex;align-items:center;justify-content:center;gap:8px;}

/* ---------- category chips ---------- */
.chiprow{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:26px;}
.chip{
  border:2.5px solid var(--line);border-radius:14px;padding:9px 15px;
  font-family:'Baloo 2';font-weight:700;font-size:14px;background:var(--card);
  box-shadow:3px 3px 0 var(--line);
}
.chip.active{background:var(--coral);color:#fff;}

/* ---------- gallery ---------- */
.gallery-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:22px;}
.gcard{
  background:var(--card);border:3px solid var(--line);border-radius:20px 26px 20px 26px;
  padding:14px;position:relative;box-shadow:5px 5px 0 var(--line);
  transition:transform .18s ease;cursor:pointer;
}
.gcard:nth-child(3n+1){border-radius:26px 18px 26px 18px;}
.gcard:nth-child(3n+2){border-radius:16px 30px 16px 30px;transform:rotate(0.6deg);}
.gcard:hover{transform:translateY(-6px) rotate(-1deg);}
.gcard .thumbwrap{background:#fff;border:2px solid var(--line);border-radius:14px;overflow:hidden;position:relative;aspect-ratio:1/1;}
.gcard svg{width:100%;height:100%;transition:transform .3s;}
.gcard:hover svg{transform:scale(1.06) rotate(1deg);}
.gcard .fav{
  position:absolute;top:10px;right:10px;width:34px;height:34px;border-radius:50%;
  background:#fff;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:16px;z-index:2;
}
.gcard .name{font-family:'Baloo 2';font-weight:700;margin-top:10px;font-size:15px;display:flex;align-items:center;gap:6px;}
.gcard .colorme{
  position:absolute;bottom:-14px;left:50%;transform:translateX(-50%) scale(0.85);
  opacity:0;transition:all .18s ease;
}
.gcard:hover .colorme{opacity:1;bottom:44px;transform:translateX(-50%) scale(1);}
.sparkle{position:absolute;font-size:14px;opacity:0;pointer-events:none;}
.gcard:hover .sparkle{animation:sparkle 1s ease forwards;}
@keyframes sparkle{0%{opacity:0;transform:scale(0)}40%{opacity:1;transform:scale(1.2)}100%{opacity:0;transform:scale(0.6) translateY(-14px)}}

/* ---------- make page ---------- */
.make-box{
  background:var(--card);border:3px solid var(--line);border-radius:28px;padding:30px;
  box-shadow:6px 6px 0 var(--line);max-width:760px;margin:0 auto;
}
.make-box h2{font-size:26px;text-align:center;}
.prompt-input{
  width:100%;font-family:'Quicksand';font-weight:600;font-size:18px;padding:16px 18px;
  border:3px solid var(--line);border-radius:18px;margin:16px 0;background:#fff;
}
.bubbles{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-bottom:18px;}
.bubble{
  border:2px solid var(--line);border-radius:999px;padding:8px 14px;font-weight:700;
  font-family:'Baloo 2';font-size:13px;background:var(--paper);
}
.bubble:hover{background:var(--yellow);}
.optrow{display:flex;gap:22px;flex-wrap:wrap;margin:18px 0;}
.optgroup{flex:1;min-width:220px;}
.optgroup .lbl{font-family:'Baloo 2';font-weight:700;font-size:14px;margin-bottom:8px;}
.pillset{display:flex;flex-wrap:wrap;gap:8px;}
.pill{
  border:2px solid var(--line);border-radius:12px;padding:7px 12px;font-size:13px;font-weight:700;
  font-family:'Baloo 2';background:#fff;
}
.pill.on{background:var(--mint);}
.gen-btn-row{text-align:center;margin-top:10px;}
.results-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:18px;margin-top:26px;}
.rescard{background:#fff;border:3px solid var(--line);border-radius:18px;padding:10px;box-shadow:4px 4px 0 var(--line);}
.rescard .thumbwrap{border:2px solid var(--line);border-radius:12px;overflow:hidden;aspect-ratio:1/1;background:#fff;}
.rescard-actions{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap;}
.pencil-loading{display:flex;flex-direction:column;align-items:center;gap:10px;padding:30px 0;}
.pencil-line{width:120px;height:6px;background:var(--line);border-radius:4px;overflow:hidden;position:relative;}
.pencil-line::after{content:"";position:absolute;left:-40%;top:0;bottom:0;width:40%;background:var(--coral);animation:pencilmove 1.1s ease-in-out infinite;}
@keyframes pencilmove{0%{left:-40%}50%{left:100%}100%{left:100%}}

/* ---------- studio ---------- */
.studio-wrap{display:grid;grid-template-columns:96px 1fr 230px;gap:18px;padding:16px 0 40px;align-items:start;}
.studio-top{display:flex;align-items:center;justify-content:space-between;padding:6px 0 14px;flex-wrap:wrap;gap:10px;}
.studio-title{display:flex;align-items:center;gap:12px;}
.save-pill{
  font-family:'Baloo 2';font-weight:700;font-size:13px;background:var(--paper-deep);
  border:2px solid var(--line);padding:6px 14px;border-radius:999px;
}
.toolcol{background:var(--card);border:3px solid var(--line);border-radius:22px;padding:12px 8px;
  display:flex;flex-direction:column;gap:8px;box-shadow:4px 4px 0 var(--line);position:sticky;top:14px;}
.tool-btn{
  width:100%;aspect-ratio:1/1;border-radius:14px;border:2.5px solid var(--line);background:#fff;
  display:flex;align-items:center;justify-content:center;font-size:24px;position:relative;
}
.tool-btn.on{background:var(--yellow);box-shadow:3px 3px 0 var(--line);transform:translate(-1px,-1px);}
.tool-btn:hover{background:var(--paper-deep);}
.canvas-area{display:flex;flex-direction:column;align-items:center;gap:14px;}
.canvas-zoom-wrap{max-width:100%;overflow:auto;padding:6px;}
.canvas-frame{
  background:#fff;border:4px solid var(--line);border-radius:22px;
  box-shadow:8px 8px 0 var(--line);padding:10px;position:relative;touch-action:none;
  transition:transform .18s ease;transform-origin:center;
}
.canvas-frame canvas{display:block;border-radius:14px;touch-action:none;background:#fff;}
.canvas-frame canvas#lineCanvas{background:transparent;}
.sizebar{display:flex;align-items:center;gap:14px;background:var(--card);border:2.5px solid var(--line);border-radius:16px;padding:10px 18px;flex-wrap:wrap;justify-content:center;}
.sizebar input[type=range]{width:170px;}
.sizeicons{display:flex;align-items:center;gap:8px;font-size:11px;font-family:'Baloo 2';font-weight:700;}
.zoom-btn{
  width:32px;height:32px;border-radius:50%;border:2px solid var(--line);background:#fff;
  display:flex;align-items:center;justify-content:center;
}
.zoom-btn:hover{background:var(--paper-deep);}
.sticker-row{display:flex;gap:8px;background:var(--card);border:2.5px solid var(--line);border-radius:16px;padding:8px 12px;}
.sticker-pick{
  width:38px;height:38px;border-radius:12px;border:2px solid var(--line);background:#fff;
  display:flex;align-items:center;justify-content:center;color:var(--coral);
}
.sticker-pick.on{background:var(--yellow);box-shadow:2px 2px 0 var(--line);}
#mirrorBtn.on{background:var(--sky);box-shadow:3px 3px 0 var(--line);}
.rightcol{display:flex;flex-direction:column;gap:14px;position:sticky;top:14px;}
.palette-box{background:var(--card);border:3px solid var(--line);border-radius:22px;padding:14px;box-shadow:4px 4px 0 var(--line);}
.custom-color-preview{align-items:center;gap:8px;margin-top:10px;flex-wrap:wrap;}
.preview-swatch{width:32px;height:32px;border-radius:50%;border:2.5px solid var(--line);flex-shrink:0;}
.palette-box .lbl{font-family:'Baloo 2';font-weight:700;margin-bottom:10px;}
.blobgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;}
.blob{
  width:100%;aspect-ratio:1/1;border-radius:55% 45% 60% 40%/45% 55% 40% 60%;
  border:2.5px solid var(--line);cursor:pointer;position:relative;
}
.blob.on{outline:3px solid var(--ink);outline-offset:2px;transform:scale(1.1);}
.makecolor-btn{width:100%;margin-top:10px;}
.actionbox{background:var(--card);border:3px solid var(--line);border-radius:22px;padding:14px;box-shadow:4px 4px 0 var(--line);display:flex;flex-direction:column;gap:8px;}
.mode-toggle{display:flex;gap:6px;margin-top:4px;}
.mode-toggle button{flex:1;padding:8px 4px;font-size:12px;}

/* ---------- my art / favorites ---------- */
.shelf-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:24px;}
.shelfcard{
  background:#fff8ea;border:3px solid var(--line);border-radius:4px 4px 16px 16px;
  padding:12px;position:relative;box-shadow:5px 5px 0 var(--line);
}
.pin{position:absolute;top:-14px;left:50%;transform:translateX(-50%);width:26px;height:26px;border-radius:50%;background:var(--coral);border:2px solid var(--line);}
.shelfcard .thumbwrap{border:2px solid var(--line);border-radius:10px;overflow:hidden;aspect-ratio:1/1;background:#fff;}
.shelfcard .meta{font-size:12px;color:#6b5c4e;margin-top:8px;display:flex;justify-content:space-between;align-items:center;}
.status-badge{font-family:'Baloo 2';font-weight:700;font-size:11px;padding:3px 9px;border-radius:999px;border:1.5px solid var(--line);}
.status-badge.done{background:var(--mint);}
.status-badge.wip{background:var(--yellow);}
.shelf-actions{display:flex;gap:6px;margin-top:10px;}
.empty-state{text-align:center;padding:60px 20px;}
.empty-state .em{font-size:50px;margin-bottom:12px;}

/* ---------- grownups ---------- */
.gu-wrap{background:#fbfaf6;border-radius:0;padding:40px 0 60px;}
.gu-header{display:flex;align-items:center;justify-content:space-between;padding:20px 0;border-bottom:2px solid #e3dccb;flex-wrap:wrap;gap:12px;}
.plans{display:grid;grid-template-columns:repeat(3,1fr);gap:22px;margin-top:30px;}
.plan{background:#fff;border:2px solid #e3dccb;border-radius:18px;padding:26px;}
.plan.pop{border:2.5px solid var(--coral);position:relative;transform:translateY(-8px);box-shadow:0 10px 30px rgba(0,0,0,.08);}
.plan.pop::before{content:"Most Popular";position:absolute;top:-14px;left:50%;transform:translateX(-50%);background:var(--coral);color:#fff;font-family:'Baloo 2';font-size:12px;padding:5px 12px;border-radius:999px;}
.plan h3{font-size:22px;}
.price{font-family:'Baloo 2';font-size:34px;font-weight:800;margin:10px 0;}
.price span{font-size:14px;font-weight:600;color:#8a7c6c;}
.plan ul{list-style:none;padding:0;margin:16px 0;display:flex;flex-direction:column;gap:9px;font-size:14px;color:#4a3e33;}
.plan ul li::before{content:"✓ ";color:var(--mint);font-weight:800;}
.gu-tabs{display:flex;gap:8px;margin:26px 0 6px;flex-wrap:wrap;}
.gu-tab{padding:9px 16px;border-radius:10px;border:1.5px solid #e3dccb;font-weight:700;font-size:14px;background:#fff;}
.gu-tab.on{background:#2b2219;color:#fff;}
.gu-panel{background:#fff;border:1.5px solid #e3dccb;border-radius:14px;padding:22px;margin-top:14px;}
.profile-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:16px;}
.profile-card{border:1.5px solid #e3dccb;border-radius:14px;padding:16px;text-align:center;}
.profile-avatar{width:56px;height:56px;border-radius:50%;margin:0 auto 8px;display:flex;align-items:center;justify-content:center;font-size:26px;border:2px solid var(--line);}

/* ---------- modal / celebration ---------- */
.modal-overlay{position:fixed;inset:0;background:rgba(43,34,25,0.55);display:flex;align-items:center;justify-content:center;z-index:50;padding:20px;}
.modal{background:var(--paper);border:4px solid var(--line);border-radius:26px;box-shadow:10px 10px 0 var(--line);padding:34px;max-width:440px;text-align:center;position:relative;}
.confetti-piece{position:fixed;top:-20px;z-index:60;pointer-events:none;border-radius:2px;}

/* ---------- badge toast ---------- */
.badge-toast{
  position:fixed;right:20px;bottom:20px;z-index:70;background:var(--ink);color:#fff;
  border-radius:16px;padding:12px 16px;display:flex;align-items:center;gap:12px;
  box-shadow:5px 5px 0 rgba(0,0,0,0.25);font-family:'Quicksand';font-size:13px;
  animation:badgeIn .4s cubic-bezier(.2,1.4,.4,1);max-width:260px;
}
.badge-toast.out{animation:badgeOut .5s ease forwards;}
.badge-toast b{font-family:'Baloo 2';font-size:13px;color:var(--yellow);}
.badge-toast div div{font-family:'Baloo 2';font-weight:700;font-size:15px;color:#fff;}
.badge-toast-ic{
  width:40px;height:40px;border-radius:50%;background:var(--coral);flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
}
@keyframes badgeIn{from{transform:translateX(120%);opacity:0;}to{transform:translateX(0);opacity:1;}}
@keyframes badgeOut{to{transform:translateX(120%);opacity:0;}}

/* ---------- badge shelf (My Art page) ---------- */
.badge-shelf{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px;margin-bottom:34px;}
.badge-card{
  background:var(--card);border:2.5px solid var(--line);border-radius:16px;padding:14px 12px;
  text-align:center;box-shadow:3px 3px 0 var(--line);
}
.badge-card.locked{opacity:.5;filter:grayscale(0.6);}
.badge-card .badge-ic{
  width:48px;height:48px;border-radius:50%;background:var(--coral);color:#fff;margin:0 auto 8px;
  display:flex;align-items:center;justify-content:center;
}
.badge-card.locked .badge-ic{background:#b8ab98;}
.badge-card b{font-family:'Baloo 2';font-size:13px;display:block;}
.badge-card p{font-size:11px;color:#8a7c6c;margin:4px 0 0;}

/* footer note in child area kept minimal */
.foot{padding:30px 0 60px;text-align:center;color:#8a7c6c;font-size:13px;}

@media (max-width: 900px){
  .hero-grid{grid-template-columns:1fr;}
  .hero-art{height:280px;}
  .hero h1{font-size:40px;}
  .studio-wrap{grid-template-columns:1fr;}
  .toolcol{flex-direction:row;overflow-x:auto;position:static;}
  .tool-btn{min-width:56px;}
  .rightcol{position:static;}
  .plans{grid-template-columns:1fr;}
  .plan.pop{transform:none;}
}
</style>
</head>
<body>
<div id="root"></div>

<script>

/* ---------- tiny shape helpers for building line-art SVGs ---------- */
function starPts(cx, cy, rOuter, rInner, spikes){
  let pts=[]; const step=Math.PI/spikes; let rot=-Math.PI/2;
  for(let i=0;i<spikes;i++){
    pts.push((cx+Math.cos(rot)*rOuter).toFixed(1)+","+(cy+Math.sin(rot)*rOuter).toFixed(1));
    rot+=step;
    pts.push((cx+Math.cos(rot)*rInner).toFixed(1)+","+(cy+Math.sin(rot)*rInner).toFixed(1));
    rot+=step;
  }
  return pts.join(" ");
}
function triPts(cx, cyBase, w, h){
  return `${cx},${cyBase-h} ${cx-w/2},${cyBase} ${cx+w/2},${cyBase}`;
}
function zigzagCrown(x,y,w,h,peaks){
  let pts=[`${x},${y+h}`];
  const step=w/peaks;
  for(let i=0;i<=peaks;i++){
    const px=x+i*step;
    pts.push(`${px},${i%1===0? y : y+h*0.5}`);
    if(i<peaks) pts.push(`${px+step/2},${y+h*0.55}`);
  }
  pts.push(`${x+w},${y+h}`);
  return pts.join(" ");
}

const G_CLOSE = '</g>';

function svgMarkup(key, size, opts){
  const t = TEMPLATES[key];
  const bg = (opts && opts.transparent) ? "" : `<rect width="560" height="560" fill="#ffffff"/>`;
  return `<svg viewBox="0 0 560 560" width="${size}" height="${size}" xmlns="http://www.w3.org/2000/svg">${bg}${G_OPEN}${t.build()}${G_CLOSE}</svg>`;
}
function svgDataUrl(key){
  return "data:image/svg+xml;utf8," + encodeURIComponent(svgMarkup(key, 560));
}

function starPtsArr(cx,cy,rOuter,rInner,spikes){
  let pts=[]; const step=Math.PI/spikes; let rot=-Math.PI/2;
  for(let i=0;i<spikes;i++){ pts.push([cx+Math.cos(rot)*rOuter, cy+Math.sin(rot)*rOuter]); rot+=step; pts.push([cx+Math.cos(rot)*rInner, cy+Math.sin(rot)*rInner]); rot+=step; }
  return pts;
}

/* =========================================================
   SOUND ENGINE — tiny synthesized sound effects, no assets
   ========================================================= */
const SFX = (()=>{
  let ctx=null;
  function ac(){ if(!ctx){ try{ ctx=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ ctx=null; } } return ctx; }
  function tone(freq, dur, type, gain, delay){
    const a=ac(); if(!a || !state.soundOn) return;
    if(a.state==="suspended") a.resume();
    const t0=a.currentTime+(delay||0);
    const osc=a.createOscillator(); const g=a.createGain();
    osc.type=type||"sine"; osc.frequency.setValueAtTime(freq,t0);
    g.gain.setValueAtTime(0.0001,t0);
    g.gain.exponentialRampToValueAtTime(gain||0.12,t0+0.015);
    g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
    osc.connect(g); g.connect(a.destination);
    osc.start(t0); osc.stop(t0+dur+0.02);
  }
  return {
    click(){ tone(520,0.09,"triangle",0.09); },
    tool(){ tone(660,0.08,"square",0.06); },
    pop(){ tone(300,0.12,"sine",0.14); tone(500,0.14,"sine",0.1,0.05); },
    stamp(){ tone(740,0.1,"triangle",0.12); tone(980,0.12,"triangle",0.09,0.06); },
    badge(){ tone(523,0.14,"triangle",0.13); tone(659,0.14,"triangle",0.13,0.11); tone(784,0.22,"triangle",0.14,0.22); },
    complete(){ [523,659,784,1046].forEach((f,i)=>tone(f,0.22,"triangle",0.13,i*0.1)); },
  };
})();

function makeVariants(baseKey, n){

}

  const transform = `${v.flip? "scale(-1,1) translate(-560,0) ":""}rotate(${v.rot} 280 280)`;
  const extras = variantAccents(v.accent, state.makeDraft.style, state.makeDraft.detail);
  return `<svg viewBox="0 0 560 560" width="${size}" height="${size}" xmlns="http://www.w3.org/2000/svg"><rect width="560" height="560" fill="#ffffff"/><g transform="${transform}">${G_OPEN}${t.build()}${G_CLOSE}</g>${G_OPEN}${extras}${G_CLOSE}</svg>`;
}
function variantAccents(seed, style, detail){
  const detailCount = {"super-easy":0,"easy":1,"medium":2,"detailed":4}[detail] ?? 2;
  let extras="";
  const pool=[
    `<polygon points="${starPts(70+seed*30,80,14,6,4)}"/>`,
    `<polygon points="${starPts(500-seed*20,90,18,8,4)}"/>`,
    `<polygon points="${starPts(60,480,12,5,4)}"/>`,
    `<polygon points="${starPts(510,470,16,7,4)}"/>`,
    `<circle cx="${40+seed*10}" cy="260" r="10"/>`,
    `<circle cx="520" cy="${220+seed*10}" r="12"/>`,
  ];
  if(style==="magical"){ for(let i=0;i<Math.min(detailCount+1,pool.length);i++) extras+=pool[i]; }
  else if(style==="adventure"){ extras += `<path d="M20,500 Q60,470 100,500"/><path d="M460,500 Q500,470 540,500"/>`; }
  else if(style!=="simple"){ for(let i=0;i<detailCount;i++) extras+=pool[i]; }
  return extras;
}

function openStudioForVariant(v){
  const genKey = "gen_"+v.id;
  TEMPLATES[genKey] = TEMPLATES[genKey] || {
    name: (state.makeDraft.prompt || TEMPLATES[v.key].name), category:"aipictures",

}

/* ---- studio engine ---- */
let studioEngine = null;
function initStudio(){
  const templateKey = state.activeTemplateKey;
  const artId = state.activeArtId;
  const lineCanvas = document.getElementById("lineCanvas");
  const colorCanvas = document.getElementById("colorCanvas");
  const lctx = lineCanvas.getContext("2d");
  const cctx = colorCanvas.getContext("2d");
  const W=560,H=560;

  let tool="pencil", color=PALETTE[0], sizeStep=2, drawing=false, lastPt=null;
  let undoStack=[], redoStack=[];
  let lineMaskCanvas = document.createElement("canvas"); lineMaskCanvas.width=W; lineMaskCanvas.height=H;
  let lineMaskData = null;
  let saveTimer=null;

  const sizeMap={pencil:[3,5,9,14], crayon:[10,16,24,34], marker:[14,22,32,46], brush:[16,26,38,54], eraser:[18,28,42,60]};

  function currentSize(){ const arr=sizeMap[tool]||sizeMap.pencil; return arr[sizeStep-1]||arr[1]; }

  function drawLineArt(){
    const svgStr = svgMarkup(templateKey, W); // opaque white bg + black lines, used for the fill mask
    const img = new Image();
    img.onload = ()=>{
      const mctx = lineMaskCanvas.getContext("2d");
      mctx.clearRect(0,0,W,H);
      mctx.drawImage(img,0,0,W,H);
      const maskImgData = mctx.getImageData(0,0,W,H);
      lineMaskData = maskImgData.data;

      // Build the on-screen overlay from the exact same pixels, but make the
      // white background transparent so the color layer underneath shows through.
      const overlay = mctx.getImageData(0,0,W,H);
      const od = overlay.data;
      for(let i=0;i<od.length;i+=4){
        if(od[i]>200 && od[i+1]>200 && od[i+2]>200){ od[i+3]=0; }
      }
      lctx.clearRect(0,0,W,H);
      lctx.putImageData(overlay,0,0);
    };
    img.src = "data:image/svg+xml;utf8," + encodeURIComponent(svgStr);
  }

  function loadExistingArtwork(){
    if(artId){
      const entry = state.myArt.find(a=>a.id===artId);
      if(entry && entry.dataURL){
        const img=new Image();
        img.onload=()=>{ cctx.clearRect(0,0,W,H); cctx.drawImage(img,0,0,W,H); };
        img.src=entry.dataURL;
        return;
      }
    }
    cctx.clearRect(0,0,W,H);
  }

  drawLineArt();
  loadExistingArtwork();

  let stickerType = STICKER_KEYS[0];
  let mirrorOn = false;
  let zoom = 1;

  function setTool(id){
    tool=id;
    SFX.tool();
    document.querySelectorAll("#toolcol [data-tool]").forEach(b=>b.classList.toggle("on", b.dataset.tool===id));
    const labels={pencil:["pencil","Pencil"],crayon:["crayon","Crayon"],marker:["marker","Marker"],brush:["brush","Paint Brush"],bucket:["bucket","Paint Bucket"],eraser:["eraser","Eraser"],sticker:["sticker","Stickers"]};
    const lbl=document.getElementById("toolLabel");
    if(lbl){ const [ic,text]=labels[id]||["pencil",id]; lbl.innerHTML=`${icon(ic,16)} ${text}`; }
    const stickerRow = document.getElementById("stickerRow");
    if(stickerRow) stickerRow.style.display = id==="sticker" ? "flex" : "none";
  }
  document.querySelectorAll("#toolcol [data-tool]").forEach(b=>b.addEventListener("click",()=>setTool(b.dataset.tool)));
  setTool("pencil");

  document.querySelectorAll("#stickerRow [data-sticker]").forEach(b=>b.addEventListener("click",()=>{
    stickerType = b.dataset.sticker;
    document.querySelectorAll("#stickerRow [data-sticker]").forEach(x=>x.classList.toggle("on",x===b));
    SFX.tool();
  }));

  const mirrorBtn = document.getElementById("mirrorBtn");
  if(mirrorBtn) mirrorBtn.addEventListener("click",()=>{
    mirrorOn = !mirrorOn;
    mirrorBtn.classList.toggle("on", mirrorOn);
    SFX.tool();
  });

  const canvasFrame = document.getElementById("canvasFrame");
  function applyZoom(){ if(canvasFrame) canvasFrame.style.transform = `scale(${zoom})`; }
  document.getElementById("zoomInBtn").addEventListener("click",()=>{ zoom=Math.min(2,+(zoom+0.2).toFixed(2)); applyZoom(); SFX.click(); });
  document.getElementById("zoomOutBtn").addEventListener("click",()=>{ zoom=Math.max(0.6,+(zoom-0.2).toFixed(2)); applyZoom(); SFX.click(); });

  document.getElementById("sizeSlider").addEventListener("input",e=>{ sizeStep=+e.target.value; });

  document.querySelectorAll("#paletteGrid .blob").forEach(b=>b.addEventListener("click",()=>{
    color=b.dataset.color;
    document.querySelectorAll("#paletteGrid .blob").forEach(x=>x.classList.toggle("on",x===b));
  }));
  let pendingColor=null, colorBeforePreview=null;
  const previewBox = document.getElementById("customColorPreview");
  const previewSwatch = document.getElementById("previewSwatch");

  document.getElementById("makeColorBtn").addEventListener("click",()=>{
    colorBeforePreview = color;
    document.getElementById("colorPicker").click();
  });
  // 'input' fires continuously while the user drags around the color wheel —
  // only update a live preview here, don't touch the saved palette yet.
  document.getElementById("colorPicker").addEventListener("input",(e)=>{
    pendingColor = e.target.value;
    color = pendingColor; // live-preview the color on the canvas tool too
    if(previewSwatch) previewSwatch.style.background = pendingColor;
    if(previewBox) previewBox.style.display = "flex";
  });
  document.getElementById("applyColorBtn").addEventListener("click",()=>{
    if(pendingColor){
      color = pendingColor;
      if(!state.customColors.includes(pendingColor)){
        state.customColors.push(pendingColor);
        const grid=document.getElementById("paletteGrid");
        const blob=document.createElement("div");
        blob.className="blob"; blob.style.background=pendingColor; blob.dataset.color=pendingColor;
        blob.addEventListener("click",()=>{ color=blob.dataset.color; document.querySelectorAll("#paletteGrid .blob").forEach(x=>x.classList.toggle("on",x===blob)); });
        grid.appendChild(blob);
        document.querySelectorAll("#paletteGrid .blob").forEach(x=>x.classList.toggle("on", x===blob));
      } else {
        document.querySelectorAll("#paletteGrid .blob").forEach(x=>x.classList.toggle("on", x.dataset.color===pendingColor));
      }
      checkBadges();
    }
    if(previewBox) previewBox.style.display = "none";
    pendingColor = null;
    SFX.click();
  });
  document.getElementById("cancelColorBtn").addEventListener("click",()=>{
    color = colorBeforePreview || PALETTE[0];
    document.querySelectorAll("#paletteGrid .blob").forEach(x=>x.classList.toggle("on", x.dataset.color===color));
    if(previewBox) previewBox.style.display = "none";
    pendingColor = null;
  });

  function pushUndo(){
    undoStack.push(colorCanvas.toDataURL());
    if(undoStack.length>25) undoStack.shift();
    redoStack=[];
  }
  function restoreFromDataUrl(url){
    const img=new Image();
    img.onload=()=>{ cctx.clearRect(0,0,W,H); cctx.drawImage(img,0,0,W,H); };
    img.src=url;
  }
  document.getElementById("undoBtn").addEventListener("click",()=>{
    if(!undoStack.length) return;
    redoStack.push(colorCanvas.toDataURL());
    restoreFromDataUrl(undoStack.pop());
    scheduleSave();
  });
  document.getElementById("redoBtn").addEventListener("click",()=>{
    if(!redoStack.length) return;
    undoStack.push(colorCanvas.toDataURL());
    restoreFromDataUrl(redoStack.pop());
    scheduleSave();
  });

  function hexToRgb(hex){
    hex=hex.replace("#","");
    if(hex.length===3) hex=hex.split("").map(c=>c+c).join("");
    const n=parseInt(hex,16);
    return [(n>>16)&255,(n>>8)&255,n&255];
  }

  function floodFillAt(px,py, fillHex){
    if(!lineMaskData) return;
    const [fr,fg,fb]=hexToRgb(fillHex);
    const img = cctx.getImageData(0,0,W,H);
    const data = img.data;
    const startIdx = (py*W+px);
    if(lineMaskData[startIdx*4] < 140 && lineMaskData[startIdx*4+1] < 140 && lineMaskData[startIdx*4+2] < 140) return; // clicked on a line
    const visited = new Uint8Array(W*H);
    const stack = new Int32Array(W*H); let sp=0;
    stack[sp++]=startIdx;
    visited[startIdx]=1;
    while(sp>0){
      const idx = stack[--sp];
      const x = idx % W, y = (idx / W)|0;
      const p = idx*4;
      data[p]=fr; data[p+1]=fg; data[p+2]=fb; data[p+3]=255;
      const neighbors=[idx-1,idx+1,idx-W,idx+W];
      const nx=[x-1,x+1,x,x];
      const ny=[y,y,y-1,y+1];
      for(let i=0;i<4;i++){
        const nIdx=neighbors[i];
        if(nx[i]<0||nx[i]>=W||ny[i]<0||ny[i]>=H) continue;
        if(visited[nIdx]) continue;
        const lp=nIdx*4;
        if(lineMaskData[lp] < 140 && lineMaskData[lp+1] < 140 && lineMaskData[lp+2] < 140) continue;
        visited[nIdx]=1;
        stack[sp++]=nIdx;
      }
    }
    cctx.putImageData(img,0,0);
  }

  function pointerPos(e){
    const rect = colorCanvas.getBoundingClientRect();
    const cx = (e.touches? e.touches[0].clientX : e.clientX) - rect.left;
    const cy = (e.touches? e.touches[0].clientY : e.clientY) - rect.top;
    return { x: Math.round(cx * (W/rect.width)), y: Math.round(cy * (H/rect.height)) };
  }

  function strokeSegment(p0,p1){
    const size = currentSize();
    cctx.lineCap="round"; cctx.lineJoin="round";
    if(tool==="eraser"){
      cctx.globalCompositeOperation="destination-out";
      cctx.globalAlpha=1; cctx.lineWidth=size;
      cctx.beginPath(); cctx.moveTo(p0.x,p0.y); cctx.lineTo(p1.x,p1.y); cctx.stroke();
      cctx.globalCompositeOperation="source-over";
      return;
    }
    cctx.globalCompositeOperation="source-over";
    cctx.strokeStyle=color; cctx.shadowBlur=0; cctx.shadowColor="transparent";
    if(tool==="pencil"){
      cctx.globalAlpha=1; cctx.lineWidth=Math.max(2,size*0.5);
      cctx.beginPath(); cctx.moveTo(p0.x,p0.y); cctx.lineTo(p1.x,p1.y); cctx.stroke();
    } else if(tool==="crayon"){
      cctx.lineWidth=size;
      for(let i=0;i<3;i++){
        cctx.globalAlpha=0.28+Math.random()*0.2;
        const jx=(Math.random()-0.5)*size*0.25, jy=(Math.random()-0.5)*size*0.25;
        cctx.beginPath(); cctx.moveTo(p0.x+jx,p0.y+jy); cctx.lineTo(p1.x+jx,p1.y+jy); cctx.stroke();
      }
      cctx.globalAlpha=1;
    } else if(tool==="marker"){
      cctx.globalAlpha=0.55; cctx.lineWidth=size;
      cctx.beginPath(); cctx.moveTo(p0.x,p0.y); cctx.lineTo(p1.x,p1.y); cctx.stroke();
      cctx.globalAlpha=1;
    } else if(tool==="brush"){
      cctx.globalAlpha=0.75; cctx.lineWidth=size; cctx.shadowBlur=size*0.35; cctx.shadowColor=color;
      cctx.beginPath(); cctx.moveTo(p0.x,p0.y); cctx.lineTo(p1.x,p1.y); cctx.stroke();
      cctx.shadowBlur=0; cctx.globalAlpha=1;
    }
  }

  function buildPreviewDataUrl(){
    // flattens color layer + black outlines onto a white page, for shelf thumbnails
    const tmp = document.createElement("canvas"); tmp.width=W; tmp.height=H;
    const tctx = tmp.getContext("2d");
    tctx.fillStyle="#ffffff"; tctx.fillRect(0,0,W,H);
    tctx.drawImage(colorCanvas,0,0);
    tctx.drawImage(lineCanvas,0,0);
    return tmp.toDataURL();
  }

  function scheduleSave(){
    const pill=document.getElementById("savePill");
    if(pill) pill.innerHTML=`${icon("sparkle",14)} Saving...`;
    clearTimeout(saveTimer);
    saveTimer=setTimeout(()=>{
      const dataURL = colorCanvas.toDataURL();
      const preview = buildPreviewDataUrl();
      let id = state.activeArtId;
      if(!id){
        id = "art_"+Date.now();
        state.activeArtId = id;
        state.myArt.unshift({id, key:templateKey, dataURL, preview, date:new Date().toLocaleDateString(), finished:false});
      } else {
        const entry = state.myArt.find(a=>a.id===id);
        if(entry){ entry.dataURL=dataURL; entry.preview=preview; }
        else state.myArt.unshift({id, key:templateKey, dataURL, preview, date:new Date().toLocaleDateString(), finished:false});
      }
      if(pill) pill.innerHTML=`${icon("cloud",14)} Saved!`;
    }, 500);
  }

  function stampSticker(x,y,mirrored){
    const size = 18 + sizeStep*10;
    STICKERS[stickerType].draw(cctx, x, y, size, color);
    if(!mirrored){
      state.stickersPlaced = (state.stickersPlaced||0)+1;
      SFX.stamp();
    }
  }

  colorCanvas.addEventListener("pointerdown",(e)=>{
    e.preventDefault();
    const p = pointerPos(e);
    if(tool==="sticker"){
      pushUndo();
      stampSticker(p.x,p.y,false);
      if(mirrorOn) stampSticker(W-p.x,p.y,true);
      scheduleSave();
      return;
    }
    if(tool==="bucket"){
      pushUndo();
      floodFillAt(p.x,p.y,color);
      if(mirrorOn) floodFillAt(W-p.x,p.y,color);
      SFX.pop();
      scheduleSave();
      return;
    }
    pushUndo();
    drawing=true; lastPt=p;
    strokeSegment(p,p);
    if(mirrorOn) strokeSegment({x:W-p.x,y:p.y},{x:W-p.x,y:p.y});
  });
  colorCanvas.addEventListener("pointermove",(e)=>{
    if(!drawing) return;
    e.preventDefault();
    const p = pointerPos(e);
    strokeSegment(lastPt,p);
    if(mirrorOn) strokeSegment({x:W-lastPt.x,y:lastPt.y},{x:W-p.x,y:p.y});
    lastPt=p;
  });
  window.addEventListener("pointerup",()=>{ if(drawing){ drawing=false; scheduleSave(); } });

  document.getElementById("magicFillBtn").addEventListener("click",()=>{
    setTool("bucket");
    const pill=document.getElementById("savePill");
    if(pill){ pill.innerHTML=`${icon("sparkle",14)} pick a spot to fill!`; setTimeout(()=>{ pill.innerHTML=`${icon("cloud",14)} Saved!`; },1800); }
  });

  document.getElementById("favPageBtn").addEventListener("click",(e)=>{
    if(state.favorites.has(templateKey)) state.favorites.delete(templateKey); else state.favorites.add(templateKey);
    const btn = e.target.closest("button");
    btn.innerHTML = state.favorites.has(templateKey)? `${icon("starFilled",14,"var(--coral)")} Favorited!` : `${icon("starOutline",14)} Favorite this picture`;
    SFX.click();
    checkBadges();
  });

  document.getElementById("downloadBtn").addEventListener("click",()=>{
    SFX.click();
    const pname = (TEMPLATES[templateKey] && TEMPLATES[templateKey].name) || "my-picture";
    downloadDataUrl(buildPreviewDataUrl(), pname.replace(/\s+/g,"-").toLowerCase()+".png");
  });

  document.getElementById("doneBtn").addEventListener("click",()=>{
    const id = state.activeArtId;
    const dataURL = colorCanvas.toDataURL();
    const preview = buildPreviewDataUrl();
    if(id){
      const entry = state.myArt.find(a=>a.id===id);
      if(entry){ entry.finished=true; entry.dataURL=dataURL; entry.preview=preview; }
    } else {
      const newId="art_"+Date.now();
      state.activeArtId=newId;
      state.myArt.unshift({id:newId,key:templateKey,dataURL,preview,date:new Date().toLocaleDateString(),finished:true});
    }
    SFX.complete();
    celebrate();
    checkBadges();
  });
}

function downloadDataUrl(dataUrl, filename){
  const a=document.createElement("a");
  a.href=dataUrl; a.download=filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
}

function checkBadges(){
  BADGES.forEach(b=>{
    if(!state.badges.has(b.id) && b.test(state)){
      state.badges.add(b.id);
      showBadgeToast(b);
    }
  });
}
function showBadgeToast(b){
  SFX.badge();
  const host = document.getElementById("badgeToastHost") || (()=>{ const d=document.createElement("div"); d.id="badgeToastHost"; document.body.appendChild(d); return d; })();
  const el = document.createElement("div");
  el.className="badge-toast";
  el.innerHTML = `<div class="badge-toast-ic">${icon(b.ic,26,"#fff")}</div><div><b>Badge earned!</b><div>${b.name}</div></div>`;
  host.appendChild(el);
  setTimeout(()=>{ el.classList.add("out"); setTimeout(()=>el.remove(),500); }, 3200);
}

function celebrate(){
  const host = document.getElementById("celebrateHost");
  const colors=["#FF6F59","#FFC93C","#57B8E0","#59C6A0","#B79CED","#FF9EC7"];
  let pieces="";
  for(let i=0;i<40;i++){
    const left = Math.random()*100;
    const dur = 1.6+Math.random()*1.4;
    const delay = Math.random()*0.4;
    const size = 6+Math.random()*8;
    const c = colors[i%colors.length];
    pieces += `<div class="confetti-piece" style="left:${left}%;width:${size}px;height:${size*0.6}px;background:${c};animation:fall ${dur}s ease-in ${delay}s forwards;"></div>`;
  }
  host.innerHTML = `
    <style>@keyframes fall{to{transform:translateY(110vh) rotate(400deg);opacity:.2;}}</style>
    ${pieces}
    <div class="modal-overlay" id="doneOverlay">
      <div class="modal">
        <div style="color:var(--coral);display:flex;justify-content:center;">${icon("party",54)}</div>
        <h2 style="margin:10px 0;">Amazing work!</h2>
        <p style="color:#6b5c4e;margin-bottom:20px;">Your picture is finished and saved to My Art Shelf.</p>
        <div style="display:flex;gap:10px;flex-wrap:wrap;justify-content:center;">
          <button class="btn small ghost" id="keepColoringBtn">${icon("palette",14)} Keep Coloring</button>
          <button class="btn small mint" id="saveDoneBtn">${icon("image",14)} Save My Picture</button>
          <button class="btn small pink" id="favDoneBtn">${icon("starOutline",14)} Add to Favorites</button>
          <button class="btn small coral" id="anotherDoneBtn">${icon("sparkle",14)} Color Another</button>
        </div>
      </div>
    </div>`;
  document.getElementById("keepColoringBtn").addEventListener("click",()=>{ host.innerHTML=""; });
  document.getElementById("saveDoneBtn").addEventListener("click",()=>{ go("myart"); });
  document.getElementById("favDoneBtn").addEventListener("click",()=>{
    state.favorites.add(state.activeTemplateKey); host.innerHTML=""; 
  });
  document.getElementById("anotherDoneBtn").addEventListener("click",()=>{ go("home2"); });
}

    <div class="section-head"><h2>Your pictures, pinned up and proud</h2></div>
    ${badgeShelfHTML()}
    ${state.myArt.length? `<div class="shelf-grid">${state.myArt.map(shelfCard).join("")}</div>` :
      `<div class="empty-state"><div class="em">${icon("image",40)}</div><h3>Nothing on the shelf yet</h3><p style="color:#8a7c6c;margin:10px 0 20px;">Color a picture and it'll show up right here.</p><button class="btn coral" data-nav="home2">Start Coloring</button></div>`}
  </div>
  ${footHTML()}
  `;
}
function badgeShelfHTML(){
  return `
  <h3 style="margin:0 0 14px;font-size:18px;">${icon("medal",18)} Your Badges (${state.badges.size}/${BADGES.length})</h3>
  <div class="badge-shelf">
    ${BADGES.map(b=>{
      const got = state.badges.has(b.id);
      return `<div class="badge-card ${got?'':'locked'}" title="${escapeHtml(b.desc)}">
        <div class="badge-ic">${icon(got?b.ic:"lock",22,"#fff")}</div>
        <b>${b.name}</b>
        <p>${got? "Earned!" : b.desc}</p>

    }).join("")}
  </div>`;
}
function shelfCard(a){
  const t = TEMPLATES[a.key] || {name:"My Picture"};
  return `
  <div class="shelfcard">
    <div class="pin"></div>
    <div class="thumbwrap"><img src="${a.preview || a.dataURL}" alt="${t.name}"></div>
    <div class="meta">
      <span>${a.date}</span>
      <span class="status-badge ${a.finished?'done':'wip'}">${a.finished?"Finished":"Unfinished"}</span>
    </div>
    <div class="shelf-actions">
      <button class="btn small mint" data-continue="${a.id}">Continue</button>
      <button class="btn small ghost" data-favart="${a.id}">${state.favorites.has(a.id)?icon("starFilled",14,"var(--coral)"):icon("starOutline",14)}</button>
      <button class="btn small ghost" data-dlart="${a.id}">${icon("download",14)}</button>
      <button class="btn small ghost" data-delart="${a.id}">${icon("trash",14)}</button>
    </div>
  </div>`;
}

/* =========================================================
   FAVORITES
   ========================================================= */
function favoritesHTML(){
  const favKeys = [...state.favorites].filter(k=>TEMPLATES[k]);
  const favArt = state.myArt.filter(a=>state.favorites.has(a.id));
  const empty = !favKeys.length && !favArt.length;
  return `
  ${navHTML()}
  <div class="wrap section">
    <div class="tag">${icon("starOutline",14)} Favorites</div>
    <div class="section-head"><h2>The pictures you love most</h2></div>
    ${empty? `<div class="empty-state"><div class="em">${icon("starOutline",40)}</div><h3>No favorites yet</h3><p style="color:#8a7c6c;margin:10px 0 20px;">Tap the star on any picture to save it here.</p><button class="btn coral" data-nav="home2">Browse Pictures</button></div>` : `
    <div class="gallery-grid">
      ${favKeys.map(galleryCard).join("")}
    </div>
    ${favArt.length? `<h3 style="margin:30px 0 16px;">Your finished favorites</h3><div class="shelf-grid">${favArt.map(shelfCard).join("")}</div>`:""}
    `}
  </div>
  ${footHTML()}
  `;
}

/* =========================================================
   FOOTER
   ========================================================= */
function footHTML(){
  return `<div class="foot">Made with 🖍️ for curious little artists.</div>`;
}

/* =========================================================
   ROUTER / RENDER
   ========================================================= */
function render(){
  let html="";
  const v = state.view === "home2" ? "gallery" : state.view;
  switch(v){
    case "home": html = homeHTML(); break;
    case "gallery": html = navHTML() + `<div class="wrap section" style="padding-top:26px;"><div class="tag">Coloring Gallery</div><h2 style="font-size:32px;margin-bottom:6px;">Pick something to color</h2></div>` + galleryHTML(false) + footHTML(); break;
    case "make": html = makeHTML(); break;
    case "studio": html = studioHTML(); break;
    case "myart": html = myArtHTML(); break;
    case "favorites": html = favoritesHTML(); break;
    case "grownups": html = grownupsHTML(); break;
    default: html = homeHTML();
  }
  root.innerHTML = html;
  bindNav();
  bindGlobal();
  if(v==="make") bindMake();
  if(v==="studio") initStudio();
  if(v==="grownups") bindGrownups();
  if(document.getElementById("gallerySearch")) filterGalleryDOM();
}
function bindGrownups(){
  root.querySelectorAll("[data-gutab]").forEach(b=>b.addEventListener("click",()=>{ guTab=b.dataset.gutab; render(); }));
}
function bindGlobal(){
  root.querySelectorAll("[data-open]").forEach(el=>{
    el.addEventListener("click",(e)=>{
      if(e.target.closest("[data-fav]")) return;
      openStudio(el.dataset.open, null);
    });
  });
  root.querySelectorAll("[data-open2]").forEach(el=>el.addEventListener("click",(e)=>{
    e.stopPropagation(); openStudio(el.dataset.open2, null);
  }));
  root.querySelectorAll("[data-fav]").forEach(el=>el.addEventListener("click",(e)=>{
    e.stopPropagation();
    SFX.click();
    const k=el.dataset.fav;
    if(state.favorites.has(k)) state.favorites.delete(k); else state.favorites.add(k);
    el.innerHTML = state.favorites.has(k)? icon("starFilled",18,"var(--coral)"):icon("starOutline",18);
    checkBadges();
  }));
  root.querySelectorAll("[data-filter]").forEach(el=>el.addEventListener("click",()=>{
    SFX.tool(); state.galleryFilter = el.dataset.filter; render();
  }));
  const searchBox = document.getElementById("gallerySearch");
  if(searchBox) searchBox.addEventListener("input",()=>{
    state.gallerySearch = searchBox.value;
    filterGalleryDOM();
  });
  const surprise = document.getElementById("surpriseBtn");
  if(surprise) surprise.addEventListener("click",()=>{
    SFX.click();
    const k = TEMPLATE_KEYS[Math.floor(Math.random()*TEMPLATE_KEYS.length)];
    openStudio(k,null);
  });
  root.querySelectorAll("[data-continue]").forEach(el=>el.addEventListener("click",()=>{
    SFX.click();
    const a = state.myArt.find(x=>x.id===el.dataset.continue);
    if(a) openStudio(a.key, a.id);
  }));
  root.querySelectorAll("[data-favart]").forEach(el=>el.addEventListener("click",()=>{
    SFX.click();
    const id=el.dataset.favart;
    if(state.favorites.has(id)) state.favorites.delete(id); else state.favorites.add(id);
    checkBadges();
    render();
  }));
  root.querySelectorAll("[data-dlart]").forEach(el=>el.addEventListener("click",()=>{
    SFX.click();
    const a = state.myArt.find(x=>x.id===el.dataset.dlart);
    if(a) downloadDataUrl(a.preview||a.dataURL, "my-picture-"+a.id+".png");
  }));
  root.querySelectorAll("[data-delart]").forEach(el=>el.addEventListener("click",()=>{
    SFX.click();
    state.myArt = state.myArt.filter(a=>a.id!==el.dataset.delart);
    render();
  }));
}

render();
</script>
